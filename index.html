<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS import</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" type="module"></script>
</head>
<body>
    <header>
        <h1>Lazy loading JavaScript with <code>import()</code></h1>
    </header>
    <main>
        <form id="frmMain">
            <div>
                <label for="txtSalary">Salary</label>
                <input type="text" id="txtSalary" required pattern="[0-9]+(.[0-9]+)">
            </div>
            <div>
                <label for="txtTax">Tax</label>
                <input type="text" id="txtTax" required pattern="[0-9]{2}(.[0-9]+)?">
            </div>
            <div>
                <button type="submit">Calculate</button>
            </div>
        </form>
        <section id="results">
            The net salary is <span id="net"></span> kr.
        </section>
    </main>
    <footer>
        <p>&copy; 2021-2025 Arturo Mora-Rioja</p>
    </footer>
</body>
</html>
